name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

env:
  POSTGRES_USER: champion
  POSTGRES_PASSWORD: champion
  POSTGRES_DB: championforge
  DATABASE_URL: postgresql://champion:champion@localhost:5432/championforge
  JWT_SECRET: ci-only-secret-not-for-production
  WEB_ORIGIN: http://127.0.0.1:3000

jobs:
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run lint

  typecheck:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      # apps/api's typecheck resolves @prisma/client's generated model types and
      # @sec-champs-trail/owasp-content's compiled dist/index.d.ts (see
      # docs/adr/0002-single-docker-image.md) -- neither exists until built.
      - run: npm run build -w packages/owasp-content
      - run: npm run db:generate -w apps/api
      - run: npm run typecheck

  unit:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: champion
          POSTGRES_PASSWORD: champion
          POSTGRES_DB: championforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U champion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run build -w packages/owasp-content
      - run: npm run db:generate -w apps/api
      - run: npm run db:migrate:deploy -w apps/api
      # Most apps/api unit specs mock PrismaService, but prisma/seed.spec.ts and
      # bootstrap-admin.spec.ts exercise a real database -- hence the service above.
      - run: npm run test

  e2e:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: champion
          POSTGRES_PASSWORD: champion
          POSTGRES_DB: championforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U champion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run build -w packages/owasp-content
      - run: npm run db:generate -w apps/api
      - run: npm run db:migrate:deploy -w apps/api
      # The e2e specs read already-seeded Principles/ChecklistItems (e.g. GET
      # /api/principles) rather than creating their own -- when unit and e2e were one
      # job, prisma/seed.spec.ts (which runs the real seed() against the shared
      # Postgres) left this in place as a side effect. Split into separate jobs, each
      # gets its own empty Postgres, so it must be seeded explicitly here.
      - run: npm run db:seed -w apps/api
      - run: npm run test:e2e -w apps/api

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=moderate

  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.172.0
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep (report-only)
        run: |
          semgrep scan \
            --config=p/security-audit \
            --config=p/javascript \
            --config=p/typescript \
            --config=p/react \
            --config=p/dockerfile \
            --sarif-output=semgrep-results.sarif
      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep-results.sarif

      - name: Fail on high/critical Semgrep findings
        run: python3 .github/scripts/check-semgrep-severity.py semgrep-results.sarif

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog (pull request diff scan)
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@v3.96.0
        with:
          # Postgres detector is excluded: it flags the CI-only dev connection
          # string (postgresql://champion:champion@localhost:5432/championforge,
          # also in .env.example/docker-compose.yml) as an unverified secret on
          # every scan, since that host is unreachable from the scan context.
          extra_args: --results=verified,unknown --exclude-detectors=Postgres
      - name: TruffleHog (full history scan)
        if: github.event_name != 'pull_request'
        uses: trufflesecurity/trufflehog@v3.96.0
        with:
          base: ""
          head: ${{ github.ref_name }}
          extra_args: --results=verified,unknown --exclude-detectors=Postgres

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3.37.3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3.37.3

      - name: Fail on open high/critical CodeQL findings
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/check-codeql-alerts.sh "${{ github.repository }}" "${{ github.ref }}"

  dast:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: champion
          POSTGRES_PASSWORD: champion
          POSTGRES_DB: championforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U champion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run build -w packages/owasp-content
      - run: npm run db:generate -w apps/api
      - run: npm run db:migrate:deploy -w apps/api
      - run: npm run build -w apps/api
      - name: Build web (same VITE_API_URL as the production image)
        env:
          VITE_API_URL: /api
        run: npm run build -w apps/web
      - name: Assemble the single deployable (mirrors ./Dockerfile's runner stage)
        run: cp -r apps/web/dist apps/api/dist/public
      - name: Seed OWASP content (mirrors the Dockerfile CMD)
        run: node apps/api/dist/prisma/seed.js
      - name: Start app in background
        run: |
          node apps/api/dist/src/main.js > "$RUNNER_TEMP/app.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/api/health > /dev/null; then
              echo "App is up after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "App did not respond within timeout" >&2
          exit 1
      - name: Dump app log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/app.log" || true
      - name: ZAP Baseline Scan (report-only)
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://127.0.0.1:3000"
          fail_action: false
          allow_issue_writing: false
          artifact_name: "zap-report"
          docker_name: "ghcr.io/zaproxy/zaproxy:2.17.0"

      - name: Fail on high/critical ZAP findings
        run: python3 .github/scripts/check-zap-severity.py report_json.json
